<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #111; }
    .field { margin-bottom: 1rem; }
    .field span { font-size: .8rem; color: #888; display: block; }
    .field strong { font-size: 1.05rem; color: #111; }
    .badge {
      display: inline-block;
      padding: .25rem .7rem;
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 600;
      margin-top: .25rem;
    }
    .badge.ok  { background: #dcfce7; color: #15803d; }
    .badge.warn { background: #fef9c3; color: #92400e; }
    .actions { display: flex; gap: .75rem; margin-top: 1.75rem; }
    button {
      flex: 1;
      padding: .65rem;
      border: none;
      border-radius: 6px;
      font-size: .95rem;
      cursor: pointer;
      transition: background .2s;
    }
    #refreshBtn  { background: #4f46e5; color: #fff; }
    #refreshBtn:hover  { background: #4338ca; }
    #logoutBtn   { background: #fee2e2; color: #b91c1c; }
    #logoutBtn:hover   { background: #fecaca; }
    .error {
      background: #fee2e2;
      color: #b91c1c;
      border-radius: 6px;
      padding: .6rem .85rem;
      font-size: .85rem;
      margin-top: 1rem;
      display: none;
    }
    #loading { color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Profile</h1>
    <div id="loading">Loading…</div>
    <div id="content" style="display:none">
      <div class="field">
        <span>Username</span>
        <strong id="usernameEl">—</strong>
      </div>
      <div class="field">
        <span>Message</span>
        <strong id="messageEl">—</strong>
      </div>
      <div class="field">
        <span>Token status</span>
        <span class="badge ok" id="tokenBadge">Valid</span>
      </div>
    </div>
    <div class="error" id="errorBox"></div>
    <div class="actions">
      <button id="refreshBtn">Refresh token</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>

  <script>
    async function loadProfile() {
      try {
        // cookies are sent automatically — no token handling needed in JS
        const res = await fetch('/api/profile');
        if (res.status === 401) { window.location.href = '/login'; return; }

        const data = await res.json();
        document.getElementById('usernameEl').textContent = data.username;
        document.getElementById('messageEl').textContent  = data.message;

        const badge = document.getElementById('tokenBadge');
        if (data.token_expiring_soon) {
          badge.textContent = 'Expiring soon — refreshing…';
          badge.className   = 'badge warn';
          await fetch('/refresh', { method: 'POST' }); // server rotates cookies
          badge.textContent = 'Refreshed';
          badge.className   = 'badge ok';
        } else {
          badge.textContent = 'Valid';
          badge.className   = 'badge ok';
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } catch (err) {
        showError(err.message);
      }
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
      document.getElementById('loading').style.display = 'none';
    }

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      const res = await fetch('/refresh', { method: 'POST' });
      if (res.status === 401) { window.location.href = '/login'; return; }
      document.getElementById('tokenBadge').textContent = 'Refreshed';
      document.getElementById('tokenBadge').className   = 'badge ok';
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      // hitting /logout would clear cookies server-side; for now redirect to login
      window.location.href = '/login';
    });

    loadProfile();
  </script>
</body>
</html>
